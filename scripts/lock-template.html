<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{CASE_TITLE_HTML}} · Gaurav Avinash</title>
{{PREVIEW_HEAD}}
<!--
  Lock screen for an encrypted case study. Built from StatiCrypt's default template
  (node_modules/staticrypt/lib/password_template.html) so decryption works the same way.
  The card itself comes from assets/craft/access.js + access.css, same as the popup on the site.
  Generated by scripts/lock.mjs. Edit this file, then run: npm run lock
-->
<style>
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #241a2c;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); box-sizing: border-box; }
  /* The case study's own cover sits behind, softly blurred, so it reads as a popup over the page */
  .lk-bg { position: fixed; inset: -30px; z-index: 0; background: #3a2a35 url("{{COVER}}") center top / cover no-repeat;
    filter: blur(14px) saturate(1.1); transform: scale(1.04); }
  .lk-bg::after { content: ""; position: absolute; inset: 0; background: rgba(18, 12, 26, 0.38); }
  .lk-host { position: relative; z-index: 1; width: 100%; display: grid; place-items: center; }
  .lk-loading { position: relative; z-index: 1; width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; }
  .lk-loading.hidden { display: none; }
  /* A key is already saved or was just entered: nothing to show while the page opens, so stay as quiet as the case page itself */
  html.lk-quiet body { background: #fbf9fa; }
  html.lk-quiet .lk-bg, html.lk-quiet .lk-loading { display: none; }

  /* Preview: the real top of the case study in plain view, the next section fading out,
     and the Under NDA button that opens the same lock card as the site */
  html.lk-has-pv body { display: block; padding: 0; min-height: 0; }
  html.lk-has-pv .lk-bg, html.lk-has-pv .lk-loading { display: none; }
  .lk-pv-wrap { display: none; }
  html.lk-has-pv:not(.lk-quiet) .lk-pv-wrap { display: block; }
  /* The fading section and the button share a gate. The button rides up with the fade, then sticks
     20% up from the bottom while the faded text scrolls under it. The gate's bottom space lets the
     page scroll that little bit more, and the button ends there too. */
  /* The section's top spacing moves outside the gate, so the gate (and the button) starts where the faded text starts */
  .lk-gate { position: relative; margin-top: var(--sec, 120px); padding-bottom: 20vh; padding-bottom: 20dvh; }
  .lk-gate > section { padding-top: 0 !important; }
  .lk-gate > section { max-height: 360px; overflow: hidden; pointer-events: none; user-select: none;
    -webkit-mask-image: linear-gradient(#000 0, rgba(0,0,0,.35) 45%, transparent 100%); mask-image: linear-gradient(#000 0, rgba(0,0,0,.35) 45%, transparent 100%); }
  .lk-nda-row { position: sticky; z-index: 20; bottom: 20vh; bottom: 20dvh; display: flex; justify-content: center; margin-top: -56px; pointer-events: none; }
  .lk-nda { pointer-events: auto; display: inline-flex; align-items: center; gap: 9px; height: 48px; padding: 0 22px 0 18px; border-radius: 999px; cursor: pointer;
    font: 500 16px/1 Inter, "Neue Montreal", system-ui, sans-serif; letter-spacing: -0.01em; color: #16121c;
    background: rgba(255, 255, 255, 0.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border: 1.5px solid rgba(22, 18, 28, 0.55); box-shadow: 0 10px 30px rgba(30, 15, 40, 0.14);
    transition: transform 360ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 200ms ease; }
  .lk-nda:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(30, 15, 40, 0.2); }
  .lk-nda:focus-visible { outline: 2px solid #16121c; outline-offset: 3px; }
  .lk-nda svg { width: 18px; height: 18px; }
  @media (prefers-reduced-motion: no-preference) { .lk-loading { animation: lkSpin 900ms linear infinite; } @keyframes lkSpin { to { transform: rotate(360deg); } } }
</style>
<script>
  if ({{HAS_PREVIEW}}) document.documentElement.classList.add("lk-has-pv");
  /* Decide before first paint whether this visit will open straight away */
  (function () {
    try {
      var ok = /(^|[#&])k=/.test(location.hash);
      var raw = localStorage.getItem("ga-access");
      if (raw) { var o = JSON.parse(raw); if (o && o.k && o.exp > Date.now()) ok = true; }
      var h = localStorage.getItem("ga-access-hash"), e = localStorage.getItem("ga-access-hash-exp");
      if (h && (!e || +e > Date.now())) ok = true;
      /* Not a Wall of Portfolios visit: access.js opens it straight away (same check as there) */
      var wall = window.top !== window.self || /(^|\.)wallofportfolios\.in$/i.test((document.referrer.match(/^https?:\/\/([^\/:]+)/) || [])[1] || "") ||
        /[?&]src=(wop|wall)/i.test(location.search) || sessionStorage.getItem("ga-wall") === "1";
      if ({{WALL_MODE}} && !wall) ok = true;
      if (ok) document.documentElement.classList.add("lk-quiet");
    } catch (x) {}
  })();
</script>
<style data-gal>
{{ACCESS_CSS}}
</style>
</head>
<body {{PREVIEW_BODY_ATTRS}}>
<div class="lk-pv-wrap">
{{PREVIEW}}
</div>
<script src="{{PREFIX}}assets/craft/orb.js?v=3"></script>
<script>
  /* Paint the project orb in the preview, the same way case-min.js does on the open page */
  (function () {
    var O = window.CraftOrb; if (!O) return;
    [].forEach.call(document.querySelectorAll(".lk-pv-wrap .cm-orb[data-orb]"), function (el) {
      var k = el.getAttribute("data-orb"); if (O.has(k)) el.style.backgroundImage = O.fallback(k);
    });
  })();
</script>

<div class="lk-bg" aria-hidden="true"></div>
<div class="lk-loading" id="staticrypt_loading" role="status" aria-label="Opening"></div>
<main class="lk-host" id="lk-host"></main>

<script>
  window.GA_LOCK_PAGE = true;
  /* access.js strips #k from the address bar, so note it first */
  window.GA_LINK_KEY = /(^|[#&])k=/.test(location.hash);
</script>
<script src="{{PREFIX}}assets/craft/access.js?v=10"></script>
<script>
  /* StatiCrypt: filled in at encryption time */
  const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
  const staticryptConfig = /*[|staticrypt_config|]*/ 0;
  const CASE_STUDY = {{CASE_TITLE_JSON}};

  const staticrypt = staticryptInitiator.init(staticryptConfig, {
    rememberExpirationKey: "ga-access-hash-exp",
    rememberPassphraseKey: "ga-access-hash",
    replaceHtmlCallback: null,
    clearLocalStorageCallback: null,
  });
  const A = window.GAAccess;

  async function openWith(key) {
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(key, true);
    return isSuccessful;
  }

  window.onload = async function () {
    /* 1. #staticrypt_pwd links and a remembered hash */
    const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
    if (isSuccessful) return;
    /* 2. A key saved from a company link, the password or a request */
    const k = A && A.key();
    if (k) {
      if (window.GA_LINK_KEY) A.track("case_unlock", { method: "link", company: A.company() });
      if (await openWith(k)) return;
      try { localStorage.removeItem("ga-access"); } catch (e) {}
    }
    /* 3. Show the lock: the preview with its Under NDA button, or the plain card */
    document.documentElement.classList.remove("lk-quiet");
    document.getElementById("staticrypt_loading").classList.add("hidden");
    if ({{HAS_PREVIEW}}) {
      const btn = document.getElementById("lk-nda");
      btn.addEventListener("click", function () { A.open(CASE_STUDY, location.href, btn, { tryKey: openWith, teaser: false }); });
      return;
    }
    A.mountLock(document.getElementById("lk-host"), { title: CASE_STUDY, tryKey: openWith, backHref: "{{PREFIX}}index.html" });
  };
</script>
</body>
</html>
