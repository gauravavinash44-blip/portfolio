<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>White Label stage</title>
<style>
@font-face { font-family: "Inter"; src: url("../fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Inter"; src: url("../fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Inter"; src: url("../fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "JBM"; src: url("../fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "JBM"; src: url("../fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 2560px; height: 1440px; overflow: hidden; background: var(--bg0); }
body { font-family: "Inter", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; font-feature-settings: "ss01", "cv11", "tnum"; }
.scene { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
.mono { font-family: "JBM", ui-monospace, monospace; }
.fill { position: absolute; inset: 0; }
.persp { position: absolute; inset: 0; perspective: 3200px; transform-style: preserve-3d; }
.p3 { position: absolute; transform-style: preserve-3d; }
.glass { background: linear-gradient(180deg, var(--glass-top), var(--glass-bot)); border: 1.5px solid var(--glass-line); border-radius: 30px;
  -webkit-backdrop-filter: blur(28px) saturate(1.2); backdrop-filter: blur(28px) saturate(1.2);
  box-shadow: 0 60px 140px var(--shadow), inset 0 1.5px 0 var(--glass-hi); }
.solid { background: var(--card); border-radius: 30px; box-shadow: 0 60px 140px var(--shadow), 0 0 0 1.5px var(--card-line); color: var(--card-ink); }
.tag { display: inline-flex; align-items: center; gap: 12px; height: 46px; padding: 0 20px; border-radius: 999px; font: 500 20px/1 "JBM", monospace; letter-spacing: .02em;
  color: var(--tag-ink); background: var(--tag-bg); box-shadow: inset 0 0 0 1.5px var(--tag-line); white-space: nowrap; }
.tag i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px var(--accent); }
.bar { height: 14px; border-radius: 999px; background: var(--skel); }
.code { font: 400 23px/1.62 "JBM", monospace; color: var(--code-ink); white-space: pre; letter-spacing: 0; }
.code .k { color: var(--code-k); } .code .s { color: var(--code-s); } .code .c { color: var(--code-c); } .code .n { color: var(--code-n); } .code .p { color: var(--code-p); }
.code .ln { color: var(--code-c); opacity: .55; display: inline-block; width: 52px; }
.chrome { display: flex; gap: 12px; padding: 26px 30px 0; }
.chrome b { width: 14px; height: 14px; border-radius: 50%; background: var(--chrome-dot); }
.grain { position: absolute; inset: 0; pointer-events: none; }

:root { 
--bg0:#1f0c1a; --ink:#fff; --accent:#f078be;
--glass-top:rgba(56,22,46,.80); --glass-bot:rgba(56,22,46,.66);
--glass-line:rgba(255,255,255,.12); --glass-hi:rgba(255,255,255,.10);
--shadow:rgba(0,0,0,.45); --card:#fff; --card-line:rgba(0,0,0,.06); --card-ink:#0a0a0a;
--tag-ink:rgba(255,255,255,.86); --tag-bg:rgba(255,255,255,.06); --tag-line:rgba(255,255,255,.16);
--skel:rgba(255,255,255,.14); --chrome-dot:rgba(255,255,255,.18);
--code-ink:rgba(236,236,245,.86); --code-k:#ff9fd2; --code-s:#f2d3a3; --code-c:rgba(255,255,255,.36);
--code-n:#c7b3ff; --code-p:rgba(255,255,255,.5);
 }

</style></head>
<body><div class="scene">

    -webkit-mask-image:linear-gradient(180deg,black 0%,black 30%,transparent 92%);mask-image:linear-gradient(180deg,black 0%,black 30%,transparent 92%)"></div></div><div class="abs" style="left:-180px;top:240px;width:820px;height:400px;opacity:0.92;transform:perspective(2600px) rotateY(18deg) rotateX(7deg) rotateZ(-1.5deg);border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 80px 160px rgba(0,0,0,.5),0 0 0 1.5px rgba(255,255,255,.14)"><img src="../../../../../white-label/screens/new-create-subdomain.png" style="display:block;width:100%;height:400px;object-fit:cover;object-position:0 0"><div class="fill" style="background:rgba(0,0,0,0.04)"></div></div><div class="abs" style="left:-120px;top:760px;width:760px;height:146px;opacity:0.85;transform:perspective(2600px) rotateY(18deg) rotateX(7deg) rotateZ(-1.5deg);border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 80px 160px rgba(0,0,0,.5),0 0 0 1.5px rgba(255,255,255,.14)"><img src="../../../../../white-label/screens/sender-pending-resend.png" style="display:block;width:100%;height:146px;object-fit:cover;object-position:0 0"><div class="fill" style="background:rgba(0,0,0,0.04)"></div></div><div class="abs" style="left:2020px;top:240px;width:760px;height:146px;opacity:0.9;transform:perspective(2600px) rotateY(-18deg) rotateX(7deg) rotateZ(1.5deg);border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 80px 160px rgba(0,0,0,.5),0 0 0 1.5px rgba(255,255,255,.14)"><img src="../../../../../white-label/screens/sender-verified.png" style="display:block;width:100%;height:146px;object-fit:cover;object-position:0 0"><div class="fill" style="background:rgba(0,0,0,0.04)"></div></div><div class="abs glass" style="left:1940px;top:520px;width:880px;opacity:0.9;transform:perspective(2600px) rotateY(-16deg) rotateX(6deg);overflow:hidden"><div class="chrome"><b></b><b></b><b></b><span class="mono" style="margin-left:18px;font-size:19px;color:var(--code-c);line-height:14px">live.ts</span></div><div style="padding:28px 36px 36px"><div class="code"><span class="ln">1</span>type SenderState <span class="p">=</span> <span class="s">"empty"</span> | <span class="s">"pending"</span> | <span class="s">"resent"</span> | <span class="s">"verified"</span>
