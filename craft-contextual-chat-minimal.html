  }
  function wireWa(a) {
    const fill = () => { a.href = waLink($("#lk-name").value.trim(), $("#lk-company").value.trim() || company()); };
    fill();
    a.addEventListener("click", () => { fill(); track("whatsapp_click", {}); });
  }
  document.querySelectorAll(".lk-wa").forEach(wireWa);

  /* Password */
  $("#lk-pass-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = $("#lk-pass"), msg = $("#lk-pass-msg"), pw = input.value.trim();
    if (!pw) { msg.textContent = "Type the password first."; input.focus(); return; }
    msg.textContent = "";
    track("case_unlock", { method: "password", company: company() });
    if (await openWith(pw)) { saveKey(pw); return; }
    try { const q = JSON.parse(sessionStorage.getItem("ga-event-queue") || "[]"); q.pop(); sessionStorage.setItem("ga-event-queue", JSON.stringify(q)); } catch (err) {}
    msg.textContent = "That's not it. Try again, or request access.";
    input.select();
  });

  /* Request access */
  $("#lk-req-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target, msg = $("#lk-req-msg"), btn = f.querySelector('button[type="submit"]');
    const data = {
      name: f.name.value.trim(), role: f.role.value.trim(), company: f.company.value.trim(),
      contact: f.contact.value.trim(), website: f.website.value,
      caseStudy: CASE_STUDY, page: location.pathname,
    };
    const missing = ["name", "role", "company", "contact"].find((k) => !data[k]);
    if (missing) { msg.textContent = "Fill in all four, please."; f[missing].focus(); return; }
    msg.textContent = ""; btn.disabled = true; btn.textContent = "Sending…";
    try {
      /* No Content-Type header on purpose: the browser sends text/plain and skips the CORS preflight */
      const res = await fetch(ACCESS_ENDPOINT, { method: "POST", body: JSON.stringify(data) });
      const out = await res.json();
      if (!out || !out.ok || !out.key) throw new Error("No key");
      const comp = (out.company || data.company).replace(/\s+/g, " ").trim().slice(0, 60);
      store.set("ga-company", comp);
      store.del("ga-greet-dismissed");
      track("access_request_submitted", { company: comp, case_study: CASE_STUDY });
      track("case_unlock", { method: "request", company: comp });
      saveKey(out.key);
      if (await openWith(out.key)) return;
      throw new Error("Key didn't open the page");
    } catch (err) {
      btn.disabled = false; btn.textContent = "Send and open";
      msg.innerHTML = "Couldn't send that right now. <a class=\"lk-wa\" href=\"#\" target=\"_blank\" rel=\"noopener\">Message me on WhatsApp</a> instead.";
      msg.querySelectorAll(".lk-wa").forEach(wireWa);
    }
  });
</script>
</body>
</html>
