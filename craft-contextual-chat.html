  const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  /* GA lives on the real pages, not here: queue events for access.js to send after the page opens */
  function track(name, params) {
    try {
      const q = JSON.parse(sessionStorage.getItem("ga-event-queue") || "[]");
      q.push({ name, params }); sessionStorage.setItem("ga-event-queue", JSON.stringify(q.slice(-20)));
    } catch (e) {}
  }
  function saveKey(k) { store.set("ga-access", JSON.stringify({ k, exp: Date.now() + KEEP_DAYS * DAY })); }
  function savedKey() {
    try { const o = JSON.parse(store.get("ga-access")); if (o && o.k && o.exp > Date.now()) return o.k; } catch (e) {}
    store.del("ga-access"); return null;
  }
  function company() { return store.get("ga-company") || ""; }

  /* Company link opened straight on this page: ?for= and #k= */
  let linkKey = null;
  (function readLink() {
    const q = new URLSearchParams(location.search);
    const c = (q.get("for") || "").replace(/\s+/g, " ").trim().slice(0, 60);
    if (c) store.set("ga-company", c);
    const parts = location.hash.replace(/^#/, "").split("&").filter(Boolean), keep = [];
    parts.forEach((p) => { if (/^k=/.test(p)) linkKey = decodeURIComponent(p.slice(2)); else keep.push(p); });
    if (linkKey) {
      saveKey(linkKey);
      history.replaceState(null, "", location.pathname + location.search + (keep.length ? "#" + keep.join("&") : ""));
    }
  })();

  async function openWith(key) {
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(key, true);
    return isSuccessful;
  }

  window.onload = async function () {
    /* 1. #staticrypt_pwd links and a remembered hash (StatiCrypt's own checks) */
    const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
    if (isSuccessful) return;
    /* 2. A key saved from a company link, the password or a request */
    const k = savedKey();
    if (k) {
      if (linkKey) track("case_unlock", { method: "link", company: company() });
      if (await openWith(k)) return;
      store.del("ga-access");
    }
    showLock();
  };

  /* ───────── Lock screen ───────── */
  const $ = (s) => document.querySelector(s);
  const views = document.querySelectorAll("[data-view]");
  const back = $("#lk-back");

  function show(name) {
    views.forEach((v) => v.classList.toggle("hidden", v.dataset.view !== name));
    back.classList.toggle("hidden", name === "choose");
    const first = document.querySelector('[data-view="' + name + '"] input:not([tabindex="-1"]), [data-view="' + name + '"] .lk-btn');
    if (first) first.focus();
  }
  function showLock() {
    $("#staticrypt_loading").classList.add("hidden");
    $("#staticrypt_content").classList.remove("hidden");
    const c = company(); if (c) $("#lk-company").value = c;
    show("choose");
  }
  document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => show(b.dataset.go)));
  back.addEventListener("click", () => show("choose"));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !back.classList.contains("hidden")) show("choose"); });

  function waLink(name, comp) {
    const msg = "Hi Gaurav, I'm " + (name || "___") + " from " + (comp || "___") + ". Could I get access to your case studies?";
    return "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg);
  }
  function wireWa(a) {
    const fill = () => { a.href = waLink($("#lk-name").value.trim(), $("#lk-company").value.trim() || company()); };
    fill();
    a.addEventListener("click", () => { fill(); track("whatsapp_click", {}); });
  }
  document.querySelectorAll(".lk-wa").forEach(wireWa);

  /* Password */
  $("#lk-pass-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = $("#lk-pass"), msg = $("#lk-pass-msg"), pw = input.value.trim();
    if (!pw) { msg.textContent = "Type the password first."; input.focus(); return; }
    msg.textContent = "";
    track("case_unlock", { method: "password", company: company() });
    if (await openWith(pw)) { saveKey(pw); return; }
    try { const q = JSON.parse(sessionStorage.getItem("ga-event-queue") || "[]"); q.pop(); sessionStorage.setItem("ga-event-queue", JSON.stringify(q)); } catch (err) {}
    msg.textContent = "That's not it. Try again, or request access.";
    input.select();
  });

  /* Request access */
  $("#lk-req-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target, msg = $("#lk-req-msg"), btn = f.querySelector('button[type="submit"]');
    const data = {
      name: f.name.value.trim(), role: f.role.value.trim(), company: f.company.value.trim(),
      contact: f.contact.value.trim(), website: f.website.value,
      caseStudy: CASE_STUDY, page: location.pathname,
    };
    const missing = ["name", "role", "company", "contact"].find((k) => !data[k]);
    if (missing) { msg.textContent = "Fill in all four, please."; f[missing].focus(); return; }
    msg.textContent = ""; btn.disabled = true; btn.textContent = "Sending…";
    try {
      /* No Content-Type header on purpose: the browser sends text/plain and skips the CORS preflight */
      const res = await fetch(ACCESS_ENDPOINT, { method: "POST", body: JSON.stringify(data) });
      const out = await res.json();
      if (!out || !out.ok || !out.key) throw new Error("No key");
      const comp = (out.company || data.company).replace(/\s+/g, " ").trim().slice(0, 60);
      store.set("ga-company", comp);
      store.del("ga-greet-dismissed");
      track("access_request_submitted", { company: comp, case_study: CASE_STUDY });
      track("case_unlock", { method: "request", company: comp });
      saveKey(out.key);
      if (await openWith(out.key)) return;
      throw new Error("Key didn't open the page");
    } catch (err) {
      btn.disabled = false; btn.textContent = "Send and open";
      msg.innerHTML = "Couldn't send that right now. <a class=\"lk-wa\" href=\"#\" target=\"_blank\" rel=\"noopener\">Message me on WhatsApp</a> instead.";
      msg.querySelectorAll(".lk-wa").forEach(wireWa);
    }
  });
</script>
</body>
</html>
