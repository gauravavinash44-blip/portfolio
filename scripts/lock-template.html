<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{CASE_TITLE_HTML}} · Gaurav Avinash</title>
<link rel="icon" href="{{PREFIX}}assets/craft/icons/chat-spark.png">
<!--
  Lock screen for an encrypted case study. Built from StatiCrypt's default template
  (node_modules/staticrypt/lib/password_template.html) so decryption works the same way.
  Generated by scripts/lock.mjs. Edit this file, then run: npm run lock
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    font: 400 15px/1.45 Inter, "Neue Montreal", "Helvetica Now Text", system-ui, -apple-system, sans-serif;
    color: #fff; background: #2a1f2c; -webkit-font-smoothing: antialiased;
  }
  .lk-bg { position: fixed; inset: -40px; z-index: 0; background: #3a2a35 url("{{COVER}}") center / cover no-repeat;
    filter: blur(26px) saturate(1.15); transform: scale(1.06); }
  .lk-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,12,24,.35), rgba(20,12,24,.55)); }
  .hidden { display: none !important; }

  .lk-card { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 28px 24px 22px; border-radius: 32px;
    background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(32px) saturate(1.5); backdrop-filter: blur(32px) saturate(1.5);
    border: 1px solid rgba(255,255,255,.28); box-shadow: 0 30px 80px rgba(10,5,15,.35), inset 0 1px 0 rgba(255,255,255,.35); }
  .lk-icon { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 18px;
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); }
  .lk-eyebrow { margin: 0 0 4px; font-size: 13px; color: rgba(255,255,255,.72); }
  h1 { margin: 0; font-size: 26px; line-height: 1.15; font-weight: 500; letter-spacing: -.015em; }
  .lk-line { margin: 8px 0 22px; color: rgba(255,255,255,.82); }

  .lk-btn { appearance: none; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; padding: 0 20px;
    border-radius: 999px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.14); color: #fff;
    font-family: inherit; font-size: 15px; font-weight: 500; line-height: 1; text-decoration: none; cursor: pointer; transition: background 160ms ease, transform 160ms ease; }
  .lk-btn:hover { background: rgba(255,255,255,.24); }
  .lk-btn--main { background: #fff; color: #16121c; border-color: #fff; }
  .lk-btn--main:hover { background: rgba(255,255,255,.88); }
  .lk-btn[disabled] { opacity: .6; cursor: progress; }
  .lk-btn:focus-visible, .lk-link:focus-visible, .lk-field input:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .lk-stack { display: grid; gap: 10px; }

  .lk-form { display: grid; gap: 10px; }
  .lk-field { display: grid; gap: 6px; }
  .lk-field label { font-size: 13px; color: rgba(255,255,255,.78); }
  .lk-field input { width: 100%; height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.12); color: #fff; font: inherit; font-size: 16px; }
  .lk-field input::placeholder { color: rgba(255,255,255,.5); }
  .lk-hp { position: absolute !important; left: -9999px !important; width: 1px; height: 1px; overflow: hidden; }
  .lk-msg { min-height: 0; margin: 2px 0 0; font-size: 13px; color: #ffd9d2; }
  .lk-msg a { color: #fff; }
  .lk-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .lk-link { appearance: none; padding: 6px 2px; border: 0; background: none; color: rgba(255,255,255,.8); font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; border-radius: 6px; }
  .lk-link:hover { color: #fff; text-decoration: underline; }
  .lk-loading { position: relative; z-index: 1; width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; }

  @media (prefers-reduced-motion: no-preference) {
    .lk-card { animation: lkIn 560ms cubic-bezier(.16,1,.3,1) both; }
    .lk-view { animation: lkView 320ms cubic-bezier(.16,1,.3,1) both; }
    .lk-loading { animation: lkSpin 900ms linear infinite; }
    @keyframes lkIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes lkView { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes lkSpin { to { transform: rotate(360deg); } }
  }
  @media (min-width: 560px) { .lk-card { padding: 32px 32px 24px; } h1 { font-size: 30px; } }
</style>
</head>
<body>
<div class="lk-bg" aria-hidden="true"></div>
<div class="lk-loading" id="staticrypt_loading" role="status" aria-label="Opening"></div>

<main class="lk-card hidden" id="staticrypt_content" aria-labelledby="lk-title">
  <div class="lk-icon" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
  </div>
  <p class="lk-eyebrow">Case study</p>
  <h1 id="lk-title">{{CASE_TITLE_HTML}}</h1>
  <p class="lk-line">This one's under NDA. Pick a way in.</p>

  <!-- Choose -->
  <div class="lk-view lk-stack" data-view="choose">
    <button type="button" class="lk-btn lk-btn--main" data-go="request">Request access</button>
    <button type="button" class="lk-btn" data-go="password">I have a password</button>
    <a class="lk-btn lk-wa" href="#" target="_blank" rel="noopener">Ask me on WhatsApp</a>
  </div>

  <!-- Password -->
  <form class="lk-view lk-form hidden" data-view="password" id="lk-pass-form" novalidate>
    <div class="lk-field">
      <label for="lk-pass">Password</label>
      <input id="lk-pass" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p class="lk-msg" id="lk-pass-msg" role="alert"></p>
    <button type="submit" class="lk-btn lk-btn--main">Open case study</button>
  </form>

  <!-- Request access -->
  <form class="lk-view lk-form hidden" data-view="request" id="lk-req-form" novalidate>
    <div class="lk-field"><label for="lk-name">Name</label><input id="lk-name" name="name" autocomplete="name" required></div>
    <div class="lk-field"><label for="lk-role">Role</label><input id="lk-role" name="role" autocomplete="organization-title" placeholder="Design manager, recruiter…" required></div>
    <div class="lk-field"><label for="lk-company">Company</label><input id="lk-company" name="company" autocomplete="organization" required></div>
    <div class="lk-field"><label for="lk-contact">Email or LinkedIn</label><input id="lk-contact" name="contact" autocomplete="email" required></div>
    <div class="lk-hp" aria-hidden="true"><label for="lk-website">Website</label><input id="lk-website" name="website" tabindex="-1" autocomplete="off"></div>
    <p class="lk-msg" id="lk-req-msg" role="alert"></p>
    <button type="submit" class="lk-btn lk-btn--main">Send and open</button>
  </form>

  <div class="lk-row">
    <button type="button" class="lk-link hidden" id="lk-back">Back</button>
    <a class="lk-link" href="{{PREFIX}}index.html">Back to portfolio</a>
  </div>
</main>

<script>
  /* StatiCrypt: filled in at encryption time */
  const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
  const staticryptConfig = /*[|staticrypt_config|]*/ 0;

  /* Filled in by scripts/lock.mjs */
  const ACCESS_ENDPOINT = {{ENDPOINT_JSON}};
  const WHATSAPP_NUMBER = {{WHATSAPP_JSON}};
  const CASE_STUDY = {{CASE_TITLE_JSON}};

  const DAY = 864e5, KEEP_DAYS = 30;
  const templateConfig = {
    rememberExpirationKey: "ga-access-hash-exp",
    rememberPassphraseKey: "ga-access-hash",
    replaceHtmlCallback: null,
    clearLocalStorageCallback: null,
  };
  const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  /* GA lives on the real pages, not here: queue events for access.js to send after the page opens */
  function track(name, params) {
    try {
      const q = JSON.parse(sessionStorage.getItem("ga-event-queue") || "[]");
      q.push({ name, params }); sessionStorage.setItem("ga-event-queue", JSON.stringify(q.slice(-20)));
    } catch (e) {}
  }
  function saveKey(k) { store.set("ga-access", JSON.stringify({ k, exp: Date.now() + KEEP_DAYS * DAY })); }
  function savedKey() {
    try { const o = JSON.parse(store.get("ga-access")); if (o && o.k && o.exp > Date.now()) return o.k; } catch (e) {}
    store.del("ga-access"); return null;
  }
  function company() { return store.get("ga-company") || ""; }

  /* Company link opened straight on this page: ?for= and #k= */
  let linkKey = null;
  (function readLink() {
    const q = new URLSearchParams(location.search);
    const c = (q.get("for") || "").replace(/\s+/g, " ").trim().slice(0, 60);
    if (c) store.set("ga-company", c);
    const parts = location.hash.replace(/^#/, "").split("&").filter(Boolean), keep = [];
    parts.forEach((p) => { if (/^k=/.test(p)) linkKey = decodeURIComponent(p.slice(2)); else keep.push(p); });
    if (linkKey) {
      saveKey(linkKey);
      history.replaceState(null, "", location.pathname + location.search + (keep.length ? "#" + keep.join("&") : ""));
    }
  })();

  async function openWith(key) {
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(key, true);
    return isSuccessful;
  }

  window.onload = async function () {
    /* 1. #staticrypt_pwd links and a remembered hash (StatiCrypt's own checks) */
    const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
    if (isSuccessful) return;
    /* 2. A key saved from a company link, the password or a request */
    const k = savedKey();
    if (k) {
      if (linkKey) track("case_unlock", { method: "link", company: company() });
      if (await openWith(k)) return;
      store.del("ga-access");
    }
    showLock();
  };

  /* ───────── Lock screen ───────── */
  const $ = (s) => document.querySelector(s);
  const views = document.querySelectorAll("[data-view]");
  const back = $("#lk-back");

  function show(name) {
    views.forEach((v) => v.classList.toggle("hidden", v.dataset.view !== name));
    back.classList.toggle("hidden", name === "choose");
    const first = document.querySelector('[data-view="' + name + '"] input:not([tabindex="-1"]), [data-view="' + name + '"] .lk-btn');
    if (first) first.focus();
  }
  function showLock() {
    $("#staticrypt_loading").classList.add("hidden");
    $("#staticrypt_content").classList.remove("hidden");
    const c = company(); if (c) $("#lk-company").value = c;
    show("choose");
  }
  document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => show(b.dataset.go)));
  back.addEventListener("click", () => show("choose"));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !back.classList.contains("hidden")) show("choose"); });

  function waLink(name, comp) {
    const msg = "Hi Gaurav, I'm " + (name || "___") + " from " + (comp || "___") + ". Could I get access to your case studies?";
    return "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg);
  }
  function wireWa(a) {
    const fill = () => { a.href = waLink($("#lk-name").value.trim(), $("#lk-company").value.trim() || company()); };
    fill();
    a.addEventListener("click", () => { fill(); track("whatsapp_click", {}); });
  }
  document.querySelectorAll(".lk-wa").forEach(wireWa);

  /* Password */
  $("#lk-pass-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = $("#lk-pass"), msg = $("#lk-pass-msg"), pw = input.value.trim();
    if (!pw) { msg.textContent = "Type the password first."; input.focus(); return; }
    msg.textContent = "";
    track("case_unlock", { method: "password", company: company() });
    if (await openWith(pw)) { saveKey(pw); return; }
    try { const q = JSON.parse(sessionStorage.getItem("ga-event-queue") || "[]"); q.pop(); sessionStorage.setItem("ga-event-queue", JSON.stringify(q)); } catch (err) {}
    msg.textContent = "That's not it. Try again, or request access.";
    input.select();
  });

  /* Request access */
  $("#lk-req-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target, msg = $("#lk-req-msg"), btn = f.querySelector('button[type="submit"]');
    const data = {
      name: f.name.value.trim(), role: f.role.value.trim(), company: f.company.value.trim(),
      contact: f.contact.value.trim(), website: f.website.value,
      caseStudy: CASE_STUDY, page: location.pathname,
    };
    const missing = ["name", "role", "company", "contact"].find((k) => !data[k]);
    if (missing) { msg.textContent = "Fill in all four, please."; f[missing].focus(); return; }
    msg.textContent = ""; btn.disabled = true; btn.textContent = "Sending…";
    try {
      /* No Content-Type header on purpose: the browser sends text/plain and skips the CORS preflight */
      const res = await fetch(ACCESS_ENDPOINT, { method: "POST", body: JSON.stringify(data) });
      const out = await res.json();
      if (!out || !out.ok || !out.key) throw new Error("No key");
      const comp = (out.company || data.company).replace(/\s+/g, " ").trim().slice(0, 60);
      store.set("ga-company", comp);
      store.del("ga-greet-dismissed");
      track("access_request_submitted", { company: comp, case_study: CASE_STUDY });
      track("case_unlock", { method: "request", company: comp });
      saveKey(out.key);
      if (await openWith(out.key)) return;
      throw new Error("Key didn't open the page");
    } catch (err) {
      btn.disabled = false; btn.textContent = "Send and open";
      msg.innerHTML = "Couldn't send that right now. <a class=\"lk-wa\" href=\"#\" target=\"_blank\" rel=\"noopener\">Message me on WhatsApp</a> instead.";
      msg.querySelectorAll(".lk-wa").forEach(wireWa);
    }
  });
</script>
</body>
</html>
