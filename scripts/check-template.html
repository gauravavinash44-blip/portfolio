<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Access check</title></head>
<body>
<!--
  Lock screen for an encrypted case study (access check).
  Loaded in a hidden frame by assets/craft/access.js to test a password before leaving the page.
  It is encrypted with the same key and salt as the case studies. Generated by scripts/lock.mjs.
-->
<script>
  const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
  const staticryptConfig = /*[|staticrypt_config|]*/ 0;
  const staticrypt = staticryptInitiator.init(staticryptConfig, {
    rememberExpirationKey: "ga-access-hash-exp",
    rememberPassphraseKey: "ga-access-hash",
    replaceHtmlCallback: function () { /* only the answer matters here */ },
    clearLocalStorageCallback: null,
  });
  const tell = (ok) => { try { parent.postMessage({ gaAccessCheck: true, ok }, "*"); } catch (e) {} };
  window.onload = async function () {
    let key = null;
    try { const o = JSON.parse(localStorage.getItem("ga-access")); if (o && o.k && o.exp > Date.now()) key = o.k; } catch (e) {}
    if (!key) return tell(false);
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(key, true);
    tell(!!isSuccessful);
  };
</script>
</body>
</html>
