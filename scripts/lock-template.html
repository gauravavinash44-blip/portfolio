<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{CASE_TITLE_HTML}} · Gaurav Avinash</title>
<!--
  Lock screen for an encrypted case study. Built from StatiCrypt's default template
  (node_modules/staticrypt/lib/password_template.html) so decryption works the same way.
  The card itself comes from assets/craft/access.js + access.css, same as the popup on the site.
  Generated by scripts/lock.mjs. Edit this file, then run: npm run lock
-->
<style>
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #241a2c;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); box-sizing: border-box; }
  /* The case study's own cover sits behind, softly blurred, so it reads as a popup over the page */
  .lk-bg { position: fixed; inset: -30px; z-index: 0; background: #3a2a35 url("{{COVER}}") center top / cover no-repeat;
    filter: blur(14px) saturate(1.1); transform: scale(1.04); }
  .lk-bg::after { content: ""; position: absolute; inset: 0; background: rgba(18, 12, 26, 0.38); }
  .lk-host { position: relative; z-index: 1; width: 100%; display: grid; place-items: center; }
  .lk-loading { position: relative; z-index: 1; width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; }
  .lk-loading.hidden { display: none; }
  @media (prefers-reduced-motion: no-preference) { .lk-loading { animation: lkSpin 900ms linear infinite; } @keyframes lkSpin { to { transform: rotate(360deg); } } }
</style>
<style data-gal>
{{ACCESS_CSS}}
</style>
</head>
<body>
<div class="lk-bg" aria-hidden="true"></div>
<div class="lk-loading" id="staticrypt_loading" role="status" aria-label="Opening"></div>
<main class="lk-host" id="lk-host"></main>

<script>
  window.GA_LOCK_PAGE = true;
  /* access.js strips #k from the address bar, so note it first */
  window.GA_LINK_KEY = /(^|[#&])k=/.test(location.hash);
</script>
<script src="{{PREFIX}}assets/craft/access.js?v=4"></script>
<script>
  /* StatiCrypt: filled in at encryption time */
  const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
  const staticryptConfig = /*[|staticrypt_config|]*/ 0;
  const CASE_STUDY = {{CASE_TITLE_JSON}};

  const staticrypt = staticryptInitiator.init(staticryptConfig, {
    rememberExpirationKey: "ga-access-hash-exp",
    rememberPassphraseKey: "ga-access-hash",
    replaceHtmlCallback: null,
    clearLocalStorageCallback: null,
  });
  const A = window.GAAccess;

  async function openWith(key) {
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(key, true);
    return isSuccessful;
  }

  window.onload = async function () {
    /* 1. #staticrypt_pwd links and a remembered hash */
    const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
    if (isSuccessful) return;
    /* 2. A key saved from a company link, the password or a request */
    const k = A && A.key();
    if (k) {
      if (window.GA_LINK_KEY) A.track("case_unlock", { method: "link", company: A.company() });
      if (await openWith(k)) return;
      try { localStorage.removeItem("ga-access"); } catch (e) {}
    }
    /* 3. Show the card */
    document.getElementById("staticrypt_loading").classList.add("hidden");
    A.mountLock(document.getElementById("lk-host"), { title: CASE_STUDY, tryKey: openWith, backHref: "{{PREFIX}}index.html" });
  };
</script>
</body>
</html>
